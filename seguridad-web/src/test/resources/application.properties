# Configuración SOLO para pruebas: H2 en memoria
spring.datasource.url=jdbc:h2:mem:seguridad_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.admin.email=admin@universidad.edu
app.admin.password=admin-de-prueba
jwt.secret=clave-de-pruebas-con-al-menos-32-caracteres-para-hs256
