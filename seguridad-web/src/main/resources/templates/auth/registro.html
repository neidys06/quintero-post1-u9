<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <h1>Registro de usuario</h1>
    <form th:action="@{/registro}" th:object="${usuario}" method="post">
        <label>Nombre:
            <input type="text" th:field="*{nombre}">
        </label>
        <span class="campo-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>

        <label>Correo:
            <input type="email" th:field="*{email}">
        </label>
        <span class="campo-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

        <label>Contraseña (mínimo 8 caracteres):
            <input type="password" name="contrasenia">
        </label>
        <span class="campo-error" th:if="${#fields.hasErrors('contrasenia')}" th:errors="*{contrasenia}"></span>

        <button type="submit">Registrarse</button>
        <a th:href="@{/login}" class="btn btn-sec">Volver al login</a>
    </form>
</body>
</html>
