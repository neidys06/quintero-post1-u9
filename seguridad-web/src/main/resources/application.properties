# Conexión a MySQL (credenciales por variable de entorno, con valores de laboratorio por defecto)
spring.datasource.url=jdbc:mysql://localhost:3306/seguridad_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD:apppass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Usuario ADMIN inicial: se crea al arrancar solo si no existe. La contraseña
# NO está en el código: se toma de la variable de entorno ADMIN_PASSWORD
# (el valor después de ":" es solo para el laboratorio)
app.admin.email=admin@universidad.edu
app.admin.password=${ADMIN_PASSWORD:admin123}

# JWT (Parte 2): la clave HMAC NO está en el código. Se lee de la variable de
# entorno JWT_SECRET (mínimo 32 caracteres para HS256); el valor por defecto
# existe solo para que el laboratorio arranque sin configuración extra.
jwt.secret=${JWT_SECRET:clave-de-laboratorio-cambiar-en-produccion-32+}
jwt.expiracion-ms=3600000

server.port=8080
